<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recruiting CMS — Shaler Area Wrestling</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:    #1B3A6B;
      --red:     #c81f2d;
      --red-dk:  #a01824;
      --white:   #fff;
      --g50:     #f9fafb;
      --g100:    #f3f4f6;
      --g200:    #e5e7eb;
      --g300:    #d1d5db;
      --g400:    #9ca3af;
      --g500:    #6b7280;
      --g700:    #374151;
      --g900:    #111827;
      --sidebar: 240px;
      --topbar:  52px;
      --botbar:  60px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      color: var(--g900);
      background: var(--g100);
    }

    /* =============================================
       APP SHELL
    ============================================= */
    .app { display: flex; height: 100vh; }

    /* =============================================
       SIDEBAR
    ============================================= */
    .sidebar {
      width: var(--sidebar);
      background: var(--navy);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-head {
      padding: 1rem 1rem 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-brand {
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.3;
    }

    .sidebar-sub {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-top: 0.2rem;
    }

    .athlete-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.4rem;
    }

    .athlete-list::-webkit-scrollbar { width: 4px; }
    .athlete-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .athlete-item {
      padding: 0.65rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.12s;
    }

    .athlete-item:hover { background: rgba(255,255,255,0.07); }
    .athlete-item.active { background: var(--red); }

    .athlete-item-name {
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
    }

    .athlete-item-meta {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
      margin-top: 0.15rem;
    }

    .athlete-item.active .athlete-item-meta { color: rgba(255,255,255,0.7); }

    .sidebar-foot {
      padding: 0.6rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .btn-new-athlete {
      width: 100%;
      padding: 0.55rem;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s;
    }

    .btn-new-athlete:hover { background: rgba(255,255,255,0.15); }

    /* =============================================
       MAIN PANEL
    ============================================= */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- TOP BAR ---- */
    .topbar {
      height: var(--topbar);
      background: var(--white);
      border-bottom: 1px solid var(--g200);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 1.25rem;
      flex-shrink: 0;
    }

    .topbar-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--g700);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- FORM AREA ---- */
    .form-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
    }

    .form-area::-webkit-scrollbar { width: 5px; }
    .form-area::-webkit-scrollbar-thumb { background: var(--g300); border-radius: 3px; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--g400);
      text-align: center;
      gap: 0.4rem;
      padding: 2rem;
    }

    .empty-state h2 { font-size: 1rem; color: var(--g500); font-weight: 600; }
    .empty-state p { font-size: 0.85rem; line-height: 1.5; }

    /* ---- BOTTOM BAR ---- */
    .botbar {
      height: var(--botbar);
      background: var(--white);
      border-top: 1px solid var(--g200);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0 1.25rem;
      flex-shrink: 0;
    }

    .spacer { flex: 1; }

    /* =============================================
       FORM CARDS
    ============================================= */
    .form-card {
      background: var(--white);
      border: 1px solid var(--g200);
      border-radius: 7px;
      margin-bottom: 0.85rem;
      overflow: hidden;
    }

    .form-card-head {
      padding: 0.75rem 1.1rem;
      background: var(--g50);
      border-bottom: 1px solid var(--g200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-card-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--navy);
    }

    .form-card-body { padding: 1.1rem; }

    /* ---- GRID LAYOUTS ---- */
    .fg { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.85rem; }
    .fg-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
    .fg-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }

    .full { grid-column: 1 / -1; }

    /* ---- LABELS & INPUTS ---- */
    .fg label, .fg-2 label, .fg-3 label, .form-group label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--g500);
      margin-bottom: 0.3rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="url"],
    select {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--g200);
      border-radius: 4px;
      font-size: 0.83rem;
      font-family: inherit;
      color: var(--g900);
      background: var(--white);
      transition: border-color 0.12s, box-shadow 0.12s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 2px rgba(27,58,107,0.12);
    }

    .form-group { display: flex; flex-direction: column; }

    /* ---- DYNAMIC ROWS ---- */
    .dyn-list { display: flex; flex-direction: column; gap: 0.4rem; }

    .dyn-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.65rem;
      background: var(--g50);
      border: 1px solid var(--g200);
      border-radius: 5px;
    }

    .dyn-row input, .dyn-row select { flex: 1; min-width: 0; }
    .dyn-row input.w-sm { flex: 0 0 72px; }
    .dyn-row input.w-md { flex: 0 0 130px; }
    .dyn-row select.w-sm { flex: 0 0 110px; }

    .check-lbl {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: var(--g500);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .check-lbl input[type="checkbox"] { width: auto; }

    .btn-rm {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--g200);
      border-radius: 4px;
      color: var(--g400);
      cursor: pointer;
      font-size: 11px;
      transition: all 0.12s;
      line-height: 1;
    }

    .btn-rm:hover { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }

    .btn-add-row {
      width: 100%;
      padding: 0.45rem;
      margin-top: 0.4rem;
      background: transparent;
      border: 1px dashed var(--g300);
      border-radius: 5px;
      color: var(--g500);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
      transition: all 0.12s;
    }

    .btn-add-row:hover { border-color: var(--navy); color: var(--navy); background: rgba(27,58,107,0.03); }

    /* ---- COACHES 2-COL ---- */
    .coaches-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .col-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--g500);
      margin-bottom: 0.5rem;
    }

    /* ---- HELPER TEXT ---- */
    .hint {
      font-size: 0.75rem;
      color: var(--g400);
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .hint code {
      background: var(--g100);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      font-size: 0.75rem;
    }

    /* =============================================
       BUTTONS
    ============================================= */
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.12s;
      white-space: nowrap;
    }

    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:hover { background: #152f59; }

    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover { background: var(--red-dk); }

    .btn-ghost {
      background: var(--g100);
      color: var(--g700);
      border: 1px solid var(--g200);
    }
    .btn-ghost:hover { background: var(--g200); }

    .btn-danger {
      background: transparent;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }
    .btn-danger:hover { background: #fee2e2; }

    /* ---- FILE INPUT ---- */
    #file-input { display: none; }

    /* =============================================
       TOAST
    ============================================= */
    .toast {
      position: fixed;
      bottom: 4.5rem;
      right: 1.25rem;
      background: var(--g900);
      color: #fff;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.18s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="app">

  <!-- =============================================
       SIDEBAR
  ============================================= -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-brand">Shaler Area Wrestling</div>
      <div class="sidebar-sub">Recruiting CMS</div>
    </div>
    <div class="athlete-list" id="athlete-list"></div>
    <div class="sidebar-foot">
      <button class="btn-new-athlete" onclick="newAthlete()">+ Add New Athlete</button>
    </div>
  </aside>

  <!-- =============================================
       MAIN
  ============================================= -->
  <div class="main">

    <!-- TOP BAR -->
    <div class="topbar">
      <span class="topbar-title" id="topbar-title">Select or create an athlete</span>
      <input type="file" id="file-input" accept=".json" onchange="importJSON(this)" />
      <button class="btn btn-ghost" onclick="document.getElementById('file-input').click()">&#8645; Import JSON</button>
      <button class="btn btn-ghost" onclick="exportJSON()">&#8595; Export JSON</button>
    </div>

    <!-- FORM AREA -->
    <div class="form-area" id="form-area">
      <div class="empty-state">
        <h2>No athlete selected</h2>
        <p>
          Pick an athlete from the sidebar<br>
          or click <strong>+ Add New Athlete</strong>.<br><br>
          Your data auto-saves in the browser.<br>
          Use <strong>Export JSON</strong> to save <code>athletes.json</code>.
        </p>
      </div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="botbar" id="botbar" style="display:none">
      <button class="btn btn-danger" onclick="deleteAthlete()">Delete Profile</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost" onclick="saveAthlete()">Save Changes</button>
      <button class="btn btn-red" onclick="downloadHTML()">&#8595; Generate &amp; Download HTML</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<!-- =============================================
     JAVASCRIPT
============================================= -->
<script>

// ============================================================
// STATE
// ============================================================
let athletes = [];
let currentId = null;

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  loadStorage();
  renderSidebar();
  if (athletes.length > 0) selectAthlete(athletes[0].id);
});

// ============================================================
// STORAGE
// ============================================================
function loadStorage() {
  const raw = localStorage.getItem('shaler_cms_v1');
  if (raw) {
    try { athletes = JSON.parse(raw); return; } catch(e) {}
  }
  athletes = [westonDefault()];
  saveStorage();
}

function saveStorage() {
  localStorage.setItem('shaler_cms_v1', JSON.stringify(athletes));
}

// ============================================================
// DEFAULT ATHLETE DATA (Weston Emmons)
// ============================================================
function westonDefault() {
  return {
    id: 'wemmons',
    firstName: 'Weston', lastName: 'Emmons',
    classYear: '2028', weightClass: '165',
    height: "6'1\"", gpa: '3.5',
    currentCity: 'Pittsburgh', currentState: 'PA',
    hometown: 'Dayton', hometownState: 'OH',
    school: 'Shaler Area High School',
    email: '', photo: 'assets/images/wemmons.jpg',
    social: { twitter: '', instagram: '', facebook: '' },
    club: 'TWC / Tiger Wrestling Club',
    clubCoaches: [
      { name: 'Mason Manville', email: '', phone: '' },
      { name: 'Dwayne Nasiadka', email: '', phone: '' }
    ],
    schoolCoaches: [
      { name: "Drew D'Agostino", email: '', phone: '' },
      { name: 'Mickey Moran', email: '', phone: '' },
      { name: "Ronnie D'Amico", email: '', phone: '' }
    ],
    accolades: [
      { year: '2025', title: 'Fargo National Qualifier', detail: 'Freestyle & Greco-Roman', top: true },
      { year: '2025', title: 'PA Freestyle State Placer', detail: '4th Place', top: false },
      { year: '2025', title: 'PA Greco-Roman State Placer', detail: '5th Place', top: false },
      { year: '2024', title: 'PA Greco-Roman State Placer', detail: '6th Place', top: false },
      { year: '2022', title: 'Ohio All-Star Wrestling Team', detail: 'Team Member', top: false }
    ],
    academics: [
      { year: 'Current', title: '3.5 GPA', detail: 'Shaler Area High School' },
      { year: '2025', title: 'Honor Roll', detail: 'Academic Excellence' }
    ],
    tournaments: [],
    videos: [
      { label: '2025 Freestyle', youtubeId: '' },
      { label: '2025 Greco-Roman', youtubeId: '' },
      { label: '2025 HS Freshman Season', youtubeId: '' }
    ]
  };
}

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar() {
  const list = document.getElementById('athlete-list');
  if (!athletes.length) {
    list.innerHTML = '<p style="color:rgba(255,255,255,0.3);font-size:0.75rem;text-align:center;padding:1.5rem 1rem">No athletes yet</p>';
    return;
  }
  list.innerHTML = '';
  athletes.forEach(a => {
    const d = document.createElement('div');
    d.className = 'athlete-item' + (a.id === currentId ? ' active' : '');
    d.onclick = () => selectAthlete(a.id);
    d.innerHTML = `
      <div class="athlete-item-name">${h(a.firstName)} ${h(a.lastName)}</div>
      <div class="athlete-item-meta">Class of ${h(a.classYear)} &middot; ${h(a.weightClass)} lbs</div>`;
    list.appendChild(d);
  });
}

// ============================================================
// SELECT ATHLETE & RENDER FORM
// ============================================================
function selectAthlete(id) {
  currentId = id;
  renderSidebar();
  const a = athletes.find(x => x.id === id);
  if (!a) return;
  document.getElementById('topbar-title').textContent = a.firstName + ' ' + a.lastName;
  document.getElementById('botbar').style.display = 'flex';
  renderForm(a);
}

function renderForm(a) {
  const area = document.getElementById('form-area');
  area.innerHTML = `

    <!-- ── BASIC INFO ── -->
    <div class="form-card">
      <div class="form-card-head"><span class="form-card-title">Basic Info</span></div>
      <div class="form-card-body">
        <div class="fg">
          <div class="form-group"><label>First Name</label><input type="text" id="f-firstName" value="${h(a.firstName)}"></div>
          <div class="form-group"><label>Last Name</label><input type="text" id="f-lastName" value="${h(a.lastName)}"></div>
          <div class="form-group"><label>Profile ID (filename, no spaces)</label><input type="text" id="f-id" value="${h(a.id)}" placeholder="e.g. wemmons"></div>
          <div class="form-group"><label>Class Year</label><input type="text" id="f-classYear" value="${h(a.classYear)}" placeholder="2028"></div>
          <div class="form-group"><label>Weight Class (lbs)</label><input type="text" id="f-weightClass" value="${h(a.weightClass)}" placeholder="165"></div>
          <div class="form-group"><label>Height</label><input type="text" id="f-height" value="${h(a.height)}" placeholder="6'1&quot;"></div>
          <div class="form-group"><label>GPA</label><input type="text" id="f-gpa" value="${h(a.gpa)}" placeholder="3.5"></div>
          <div class="form-group"><label>School</label><input type="text" id="f-school" value="${h(a.school)}"></div>
          <div class="form-group"><label>City (shown in tagline)</label><input type="text" id="f-currentCity" value="${h(a.currentCity)}" placeholder="Pittsburgh"></div>
          <div class="form-group"><label>State</label><input type="text" id="f-currentState" value="${h(a.currentState)}" placeholder="PA"></div>
          <div class="form-group"><label>Hometown (stats bar)</label><input type="text" id="f-hometown" value="${h(a.hometown)}" placeholder="Dayton"></div>
          <div class="form-group"><label>Hometown State</label><input type="text" id="f-hometownState" value="${h(a.hometownState)}" placeholder="OH"></div>
          <div class="form-group full"><label>Athlete Email (for contact button)</label><input type="email" id="f-email" value="${h(a.email)}" placeholder="athlete@email.com"></div>
          <div class="form-group full"><label>Photo path (relative from recruiting folder)</label><input type="text" id="f-photo" value="${h(a.photo)}" placeholder="assets/images/wemmons.jpg"></div>
        </div>
      </div>
    </div>

    <!-- ── SOCIAL ── -->
    <div class="form-card">
      <div class="form-card-head"><span class="form-card-title">Social Links</span></div>
      <div class="form-card-body">
        <div class="fg">
          <div class="form-group"><label>X / Twitter URL</label><input type="url" id="f-twitter" value="${h(a.social.twitter)}" placeholder="https://x.com/username"></div>
          <div class="form-group"><label>Instagram URL</label><input type="url" id="f-instagram" value="${h(a.social.instagram)}" placeholder="https://instagram.com/username"></div>
          <div class="form-group"><label>Facebook URL</label><input type="url" id="f-facebook" value="${h(a.social.facebook)}" placeholder="https://facebook.com/username"></div>
        </div>
      </div>
    </div>

    <!-- ── COACHES & CLUB ── -->
    <div class="form-card">
      <div class="form-card-head"><span class="form-card-title">Coaches &amp; Club</span></div>
      <div class="form-card-body">
        <div class="form-group" style="margin-bottom:1rem">
          <label>Club Name</label>
          <input type="text" id="f-club" value="${h(a.club)}" placeholder="TWC / Tiger Wrestling Club">
        </div>
        <div class="coaches-2col">
          <div>
            <div class="col-label">School Coaches</div>
            <div class="dyn-list" id="schoolCoaches-list"></div>
            <button class="btn-add-row" onclick="addCoach('schoolCoaches-list')">+ Add School Coach</button>
          </div>
          <div>
            <div class="col-label">Club Coaches</div>
            <div class="dyn-list" id="clubCoaches-list"></div>
            <button class="btn-add-row" onclick="addCoach('clubCoaches-list')">+ Add Club Coach</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ── COMPETITION ACCOLADES ── -->
    <div class="form-card">
      <div class="form-card-head"><span class="form-card-title">Competition Accolades</span></div>
      <div class="form-card-body">
        <div class="dyn-list" id="accolades-list"></div>
        <button class="btn-add-row" onclick="addAccolade()">+ Add Accolade</button>
      </div>
    </div>

    <!-- ── ACADEMICS ── -->
    <div class="form-card">
      <div class="form-card-head"><span class="form-card-title">Academic Accolades</span></div>
      <div class="form-card-body">
        <div class="dyn-list" id="academics-list"></div>
        <button class="btn-add-row" onclick="addAcademic()">+ Add Academic Item</button>
      </div>
    </div>

    <!-- ── TOURNAMENT SCHEDULE ── -->
    <div class="form-card">
      <div class="form-card-head"><span class="form-card-title">Tournament Schedule</span></div>
      <div class="form-card-body">
        <div class="dyn-list" id="tournaments-list"></div>
        <button class="btn-add-row" onclick="addTournament()">+ Add Tournament</button>
      </div>
    </div>

    <!-- ── VIDEOS ── -->
    <div class="form-card">
      <div class="form-card-head"><span class="form-card-title">Video Highlights</span></div>
      <div class="form-card-body">
        <p class="hint">Enter only the YouTube <strong>Video ID</strong> — the part after <code>?v=</code> in the URL (e.g. <code>dQw4w9WgXcQ</code>).</p>
        <div class="dyn-list" id="videos-list"></div>
        <button class="btn-add-row" onclick="addVideo()">+ Add Video</button>
      </div>
    </div>
  `;

  // Populate dynamic lists
  fillCoaches('clubCoaches-list', a.clubCoaches);
  fillCoaches('schoolCoaches-list', a.schoolCoaches);
  fillAccolades(a.accolades);
  fillAcademics(a.academics);
  fillTournaments(a.tournaments);
  fillVideos(a.videos);
}

// ============================================================
// DYNAMIC ROW BUILDERS
// ============================================================

// ── Coaches ──
function fillCoaches(listId, coaches) {
  const el = document.getElementById(listId);
  el.innerHTML = '';

// ============================================================
// READ FORM → DATA OBJECT
// ============================================================
function readForm() {
  const v = id => (document.getElementById(id) || {}).value || '';
  const rows = (listId, fields) =>
    Array.from(document.querySelectorAll('#' + listId + ' .dyn-row')).map(row => {
      const obj = {};
      fields.forEach(f => {
        const el = row.querySelector('[data-f="' + f + '"]');
        if (el) obj[f] = el.type === 'checkbox' ? el.checked : el.value.trim();
      });
      return obj;
    });

  return {
    id:            v('f-id') || genId(v('f-firstName'), v('f-lastName')),
    firstName:     v('f-firstName'),
    lastName:      v('f-lastName'),
    classYear:     v('f-classYear'),
    weightClass:   v('f-weightClass'),
    height:        v('f-height'),
    gpa:           v('f-gpa'),
    currentCity:   v('f-currentCity'),
    currentState:  v('f-currentState'),
    hometown:      v('f-hometown'),
    hometownState: v('f-hometownState'),
    school:        v('f-school'),
    email:         v('f-email'),
    photo:         v('f-photo'),
    social: {
      twitter:   v('f-twitter'),
      instagram: v('f-instagram'),
      facebook:  v('f-facebook')
    },
    club:          v('f-club'),
    clubCoaches:   rows('clubCoaches-list',  ['name','email','phone']),
    schoolCoaches: rows('schoolCoaches-list', ['name','email','phone']),
    accolades:     rows('accolades-list',  ['year','title','detail','top']),
    academics:     rows('academics-list',  ['year','title','detail']),
    tournaments:   rows('tournaments-list',['date','event','location','style']),
    videos:        rows('videos-list',     ['label','youtubeId'])
  };
}

// ============================================================
// CRUD
// ============================================================
function saveAthlete() {
  if (!currentId) return;
  const data = readForm();
  const idx = athletes.findIndex(a => a.id === currentId);
  if (idx === -1) return;
  athletes[idx] = data;
  currentId = data.id;
  saveStorage();
  renderSidebar();
  toast('Saved!');
}

function deleteAthlete() {
  if (!currentId) return;
  if (!confirm('Delete this profile? This cannot be undone.')) return;
  athletes = athletes.filter(a => a.id !== currentId);
  currentId = null;
  saveStorage();
  renderSidebar();
  document.getElementById('form-area').innerHTML = '<div class="empty-state"><h2>Deleted</h2><p>Select or create an athlete.</p></div>';
  document.getElementById('botbar').style.display = 'none';
  document.getElementById('topbar-title').textContent = 'Select or create an athlete';
}

function newAthlete() {
  const id = 'athlete_' + Date.now();
  athletes.push({
    id, firstName: 'New', lastName: 'Athlete',
    classYear: String(new Date().getFullYear() + 4),
    weightClass: '', height: '', gpa: '',
    currentCity: 'Pittsburgh', currentState: 'PA',
    hometown: '', hometownState: '',
    school: 'Shaler Area High School',
    email: '', photo: 'assets/images/' + id + '.jpg',
    social: { twitter: '', instagram: '', facebook: '' },
    club: 'TWC / Tiger Wrestling Club',
    clubCoaches: [], schoolCoaches: [],
    accolades: [], academics: [], tournaments: [], videos: []
  });
  saveStorage();
  renderSidebar();
  selectAthlete(id);
}

// ============================================================
// IMPORT / EXPORT JSON
// ============================================================
function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.athletes && Array.isArray(data.athletes)) {
        athletes = data.athletes;
        saveStorage();
        renderSidebar();
        if (athletes.length) selectAthlete(athletes[0].id);
        toast('Imported ' + athletes.length + ' athlete(s)');
      } else {
        alert('Invalid file — expected { "athletes": [...] }');
      }
    } catch(e) { alert('JSON parse error: ' + e.message); }
  };
  reader.readAsText(file);
  input.value = '';
}

function exportJSON() {
  if (currentId) saveAthlete();
  dlFile(JSON.stringify({ athletes }, null, 2), 'athletes.json', 'application/json');
  toast('Downloaded athletes.json');
}

// ============================================================
// HELPERS
// ============================================================
function h(s) {
  return String(s || '')
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;');
}

function genId(first, last) {
  return ((first || '')[0] + (last || '')).toLowerCase().replace(/[^a-z0-9]/g, '');
}

function dlFile(content, name, type) {
  const blob = new Blob([content], { type });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
